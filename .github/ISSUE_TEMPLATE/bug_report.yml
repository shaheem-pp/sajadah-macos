name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Sajadah version
      description: Sajadah → About Sajadah
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Downloaded the DMG
        - Built from source
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: |
        Screenshots help. If it's a prayer-times problem, your calculation method and
        approximate location (city is plenty) matter — please don't paste exact coordinates.
